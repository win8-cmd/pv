[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cenep"
version = "0.1.0"
description = "CENEP - 中国工商业分布式光伏项目经济评价软件"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "CENEP Project" }]
keywords = ["photovoltaic", "pv", "china", "techno-economic", "self-consumption"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

# 运行依赖：只列出当前真正被代码使用的库。
# - PySide6：桌面界面
# - pandas / openpyxl：账单表格处理与报表导出基础
# - pypdf：第二阶段 P0-1 的 PDF 页级文本提取。纯 Python、无 C 扩展、
#   支持 Python 3.11–3.14。**仅允许在 cenep.infrastructure 中使用**，
#   领域层与计算层禁止依赖（由 tests/unit/test_layering.py 强制）。
dependencies = [
    "PySide6>=6.6",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.gui-scripts]
cenep-gui = "cenep.ui.main_window:main"

[project.scripts]
cenep = "cenep.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cenep = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "gui: 需要真实启动 Qt 事件循环的测试（无图形环境时可能被跳过）",
]
